{% extends "base.html" %}
{% block title %}{{ code }} Error – Solix Monitor{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[50vh] text-center">
  <p class="text-7xl font-bold text-slate-800">{{ code }}</p>
  <p class="text-xl font-semibold text-white mt-3">{{ message }}</p>
  <a href="{{ url_for('dashboard') }}" class="mt-6 px-5 py-2.5 rounded-lg bg-brand text-white text-sm font-medium hover:bg-brand-dark transition-colors">
    ← Back to Dashboard
  </a>
</div>
{% endblock %}
