name: Deploy to NAS

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: Notify deploy triggered
    runs-on: ubuntu-latest
    steps:
      - name: Deploy triggered
        run: |
          echo "✅ Push to main detected."
          echo "The NAS cron job will auto-pull and rebuild within 5 minutes."
          echo "Monitor: tail -f /volume2/docker/solix-monitor/deploy.log"
