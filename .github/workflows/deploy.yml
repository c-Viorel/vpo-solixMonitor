name: Deploy to NAS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger NAS redeploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping webhook
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://solix.vmedia.fun/webhook/deploy \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}")
          echo "Webhook response: $HTTP"
          if [ "$HTTP" != "202" ]; then
            echo "Webhook failed (HTTP $HTTP)" && exit 1
          fi
          echo "✅ Redeploy triggered — NAS will rebuild and restart within ~2 min"
