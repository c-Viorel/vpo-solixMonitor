services:
  solix-monitor:
    build: .
    container_name: solix-monitor
    restart: unless-stopped
    ports:
      - "8090:8080"   # Caddy proxies solix.vmedia.fun → 192.168.50.195:8090
    volumes:
      - solix-data:/data
    environment:
      - DATA_DIR=/data
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - POLL_INTERVAL=${POLL_INTERVAL:-300}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  solix-data:
    driver: local
