services:
  solix-monitor:
    build: .
    container_name: solix-monitor
    restart: unless-stopped
    ports:
      - "8090:8080"   # Caddy proxies solix.vmedia.fun → 192.168.50.195:8090
    volumes:
      - solix-data:/data
      - /volume2/docker/solix-monitor/recordings:/recordings
      - /volume2/docker/solix-monitor/app.py:/app/app.py
      - /volume2/docker/solix-monitor/db.py:/app/db.py
      - /volume2/docker/solix-monitor/thumbnail_gen.py:/app/thumbnail_gen.py
      - /volume2/docker/solix-monitor/templates:/app/templates
    environment:
      - DATA_DIR=/data
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - POLL_INTERVAL=${POLL_INTERVAL:-300}
      - DEPLOY_WEBHOOK_TOKEN=${DEPLOY_WEBHOOK_TOKEN:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - CAMERA1_NAME=${CAMERA1_NAME:-Camera 1}
      - CAMERA2_NAME=${CAMERA2_NAME:-Camera 2}
      - CAMERAS_ENABLED=${CAMERAS_ENABLED:-false}
      - RECORDINGS_DIR=/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: solix-mediamtx
    restart: unless-stopped
    network_mode: host
    volumes:
      - /volume2/docker/solix-monitor/recordings:/recordings
      - /volume2/docker/solix-monitor/mediamtx.yml:/mediamtx.yml
    environment:
      - MTX_PLAYBACK=yes
      - MTX_PATHDEFAULTS_RECORDPATH=/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
      - MTX_PATHDEFAULTS_RECORDSEGMENTDURATION=1m
      - MTX_PATHDEFAULTS_RECORDDELETEAFTER=24h
      - MTX_PATHS_CAMERA1_SOURCE=${CAMERA1_RTSP_URL:-}
      - MTX_PATHS_CAMERA1_RECORD=yes
      - MTX_PATHS_CAMERA1_SOURCEONDEMAND=no
      - MTX_PATHS_CAMERA1LO_SOURCE=${CAMERA1LO_RTSP_URL:-}
      - MTX_PATHS_CAMERA1LO_RECORD=no
      - MTX_PATHS_CAMERA1LO_SOURCEONDEMAND=yes
      - MTX_PATHS_CAMERA2_SOURCE=${CAMERA2_RTSP_URL:-}
      - MTX_PATHS_CAMERA2_RECORD=yes
      - MTX_PATHS_CAMERA2_SOURCEONDEMAND=no
      - MTX_PATHS_CAMERA2LO_SOURCE=${CAMERA2LO_RTSP_URL:-}
      - MTX_PATHS_CAMERA2LO_RECORD=no
      - MTX_PATHS_CAMERA2LO_SOURCEONDEMAND=yes
    profiles:
      - cameras

volumes:
  solix-data:
    driver: local
