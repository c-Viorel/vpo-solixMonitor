# MediaMTX configuration for Solix Monitor cameras
# Pulls RTSP streams from TAPO cameras via Tailscale and re-serves as HLS.

###############################################################################
# Network
###############################################################################
hlsAddress: :8888
rtspAddress: :8554
rtmpDisable: yes
webrtcDisable: yes
srt:
  disable: yes

###############################################################################
# HLS settings
###############################################################################
hls:
  alwaysRemux: no
  segmentDuration: 2s
  partDuration: 200ms
  segmentMaxSize: 50MB
  encryption: no

###############################################################################
# Paths (camera streams)
# Source URLs injected via env vars: MTX_PATHS_CAMERA1_SOURCE etc.
###############################################################################
paths:
  camera1:
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 60s
  camera2:
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 60s
